[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20"
  NEXT_PUBLIC_API_URL = "https://adi-phone.co.il"
  EMAIL_HOST = "smtp.gmail.com"
  EMAIL_PORT = "587"
  EMAIL_USER = "shlomiandadi@gmail.com"
  ADMIN_EMAIL = "shlomiandadi@gmail.com"
  NEXT_PUBLIC_SITE_URL = "https://adi-phone.co.il"
  NPM_FLAGS = "--legacy-peer-deps"
  # EMAIL_PASS and ADMIN_PASSWORD must be set in the Netlify UI. Never commit them.

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # Do not set node_bundler = "esbuild" here: @netlify/plugin-nextjs ships its
  # own server handler with bundler "none". Re-bundling drops prerendered HTML
  # that bot requests need after they bypass the Durable cache.
  external_node_modules = ["@prisma/client", "prisma"]
  included_files = ["prisma/**", "seo-agent-apply/base-llms.txt"]

# Weekly contact-lead retention (Contact rows older than 12 months).
[functions."lead-retention-cleanup"]
  schedule = "0 3 * * 0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HSTS: includeSubDomains kept after checking live hosts. seo.adi-phone.co.il,
    # leads.adi-phone.co.il, www, and apex are HTTPS-only (HTTP 301 → HTTPS).
    # Other guessed subdomains (api, mail, admin, …) do not resolve. No preload.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # Enforcing CSP stays the existing upgrade-insecure-requests only.
    # Report-Only allowlist from code + live HTML (GTM/GA4/Ads, Meta pixel,
    # Ahrefs, Cloudinary, Unsplash, Google Maps, self-hosted Heebo, Netlify).
    # YouTube/Vimeo are not embedded. Not enforcing — safe for /api and /admin.
    Content-Security-Policy = "upgrade-insecure-requests"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://ssl.google-analytics.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com https://www.gstatic.com https://connect.facebook.net https://analytics.ahrefs.com https://tag.netlify.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.googletagmanager.com https://www.gstatic.com; img-src 'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com https://www.google.com https://www.google.co.il https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.facebook.com https://connect.facebook.net https://*.facebook.com https://res.cloudinary.com https://images.unsplash.com https://analytics.ahrefs.com https://seo-agent-tools.netlify.app https://app.netlify.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://www.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://stats.g.doubleclick.net https://www.facebook.com https://connect.facebook.net https://graph.facebook.com https://*.facebook.com https://analytics.ahrefs.com https://res.cloudinary.com https://images.unsplash.com https://*.netlify.app https://*.netlify.com https://app.netlify.com https://tag.netlify.com https://adi-phone.co.il https://www.adi-phone.co.il https://seo.adi-phone.co.il https://leads.adi-phone.co.il https://wa.me https://api.whatsapp.com; frame-src 'self' https://www.googletagmanager.com https://www.google.com https://maps.google.com https://www.google.com/maps https://td.doubleclick.net https://rd.doubleclick.net https://www.facebook.com https://bid.g.doubleclick.net https://app.netlify.com https://tag.netlify.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://www.facebook.com https://wa.me; frame-ancestors 'none'"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "X-Requested-With, Content-Type, Authorization"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable, durable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable, durable"

# Homepage HTML for browsers. Do not use `/*` or `/:path*` — that also matches
# /netlify-prerender-function and can pin the shared bot object for a year.
[[headers]]
  for = "/"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, durable, s-maxage=31536000, stale-while-revalidate=31536000"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, durable"

# The Prerender extension rewrites crawlers to one function path. Never let
# the OG image's year-long immutable cache attach here; vary on `url` so
# /opengraph-image cannot occupy every page's bot cache.
[[headers]]
  for = "/netlify-prerender-function"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-Vary = "query=url"

[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable, durable"
    Netlify-Vary = "query"

[[headers]]
  for = "/services/*/opengraph-image"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable, durable"
    Netlify-Vary = "query"

[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

